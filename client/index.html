<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roomi | Full-Stack Developer</title>
    <meta name="description" content="Roomi — Full-Stack Developer Portfolio. MERN stack, real-time apps, and UI/UX focused development." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script>
      // Set the theme class before first paint to avoid a flash of the wrong
      // theme. Mirrors the logic in ThemeContext (localStorage → system).
      try {
        var saved = localStorage.getItem("roomi-theme");
        var isDark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (isDark) document.documentElement.classList.add("dark");
      } catch (e) {}
      // Re-apply the last-used accent colors before first paint so the
      // signature gradient/links don't flash the default indigo on reload.
      // applyAccent() caches the resolved CSS vars under this key.
      try {
        var av = JSON.parse(localStorage.getItem("roomi-accent-vars") || "null");
        if (av) {
          for (var k in av)
            document.documentElement.style.setProperty(k, av[k]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
